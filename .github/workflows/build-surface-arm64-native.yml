name: build-surface-arm64-native

on:
  workflow_dispatch:
  push:
    branches:
      - surface-arm64-native-v01
      - surface-arm64-native-v02
      - surface-arm64-native-v03
      - surface-arm64-native-v04
      - surface-arm64-native-v05
      - surface-arm64-native-v06
      - surface-arm64-native-v07
      - surface-arm64-native-v08
      - surface-arm64-native-v09
      - surface-arm64-native-v10
      - surface-arm64-native-v11
      - surface-arm64-native-v12
      - surface-arm64-native-v13
      - surface-arm64-offline-v01
      - surface-arm64-offline-v02
      - surface-arm64-offline-v03
      - surface-arm64-online-player-layout-fix
    paths:
      - 'surface-arm64/**'
      - '.github/workflows/build-surface-arm64-native.yml'

jobs:
  build-arm64:
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify touch source
        run: |
          function node {
            & (Get-Command node.exe).Source @args
            if ($LASTEXITCODE -ne 0) { throw "Node validation failed: $args" }
          }
          node --check surface-arm64/controls.js
          node --check surface-arm64/online-player-layout.js
          node --check surface-arm64/offline-controls.js
          node --check surface-arm64/online-jacket-capture.js
          node --check surface-arm64/trickplay-preview.js
          node --test surface-arm64/tests/gestures.test.cjs
          node --test surface-arm64/tests/touch-runtime.test.cjs
          node --test surface-arm64/tests/preview-runtime.test.cjs
      - name: Verify online player layout in Edge
        run: |
          npm install --prefix "$env:RUNNER_TEMP/jfd-browser-tests" --no-audit --no-fund playwright-core@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependency installation failed' }
          $env:NODE_PATH = "$env:RUNNER_TEMP/jfd-browser-tests/node_modules"
          node --test surface-arm64/tests/online-player-layout.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Online player layout regression failed' }
      - name: Restore and publish native win-arm64
        run: |
          dotnet --info
          dotnet publish surface-arm64/JellyfinSurface.csproj -c Release -r win-arm64 --self-contained true -o publish
      - name: Verify ARM64 executable, loaders and native runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path (Resolve-Path publish).Path 'JellyfinSurfaceARM64.exe'
          if (!(Test-Path $exe)) { throw 'Native executable missing' }
          if (!(Test-Path publish/controls.js)) { throw 'Touch controls missing' }
          if (!(Test-Path publish/online-player-layout.js)) { throw 'Online player layout missing' }
          if (!(Test-Path publish/offline-controls.js)) { throw 'Offline touch controls missing' }
          if (!(Test-Path publish/online-jacket-capture.js)) { throw 'Offline cover capture module missing' }
          if (!(Test-Path publish/trickplay-preview.js)) { throw 'Trickplay module missing' }
          if (!(Test-Path publish/runtimes/win-arm64/native/WebView2Loader.dll)) { throw 'ARM64 WebView2 loader missing' }
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "ARM64 native runtime self-test failed: $($process.ExitCode)" }
          'PASS: ARM64 executable and native runtime; WebView2 initialization requires Surface test.' | Set-Content publish/validation.txt
      - name: Create Portable ZIP
        run: |
          Compress-Archive -Path publish/* -DestinationPath JellyfinSurface-ARM64-offline-v03.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-surface-arm64-offline-v03
          path: JellyfinSurface-ARM64-offline-v03.zip
          if-no-files-found: error
