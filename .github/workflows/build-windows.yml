name: build-windows

env:
  MPV_VERSION: "20251214-git-f7be2ee"
  # using older version due to severe memory leak
  # https://qt-project.atlassian.net/browse/QTBUG-141377
  QT_VERSION: "6.9.3"

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - master
      - mouse-controls-v01
      - touch-controls-v01
      - seek-fullscreen-preview-v01
      - seek-fullscreen-preview-v02
      - searchhub-surface-v15

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: windows-x64
            qt_arch: win64_msvc2022_64
            qt_version: '6.9.3'
            mpv_arch: x86_64-v3
            mpv_arch_fallback: x86_64
            vc_redist_arch: x64
            vcvars: vcvars64.bat
            machine: X64
          - artifact: windows-arm64
            qt_arch: win64_msvc2022_arm64_cross_compiled
            qt_version: '6.10.0'
            mpv_arch: aarch64
            mpv_arch_fallback: ""
            vc_redist_arch: arm64
            vcvars: vcvarsamd64_arm64.bat
            machine: ARM64
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Validate mouse controls
      run: |
        node --check native/nativeshell.js
        node --check native/mpvVideoPlayer.js
        node --check native/inputPlugin.js
        node --test tests/test_mouse_controls.cjs
        node --test tests/test_fullscreen_trickplay.cjs
        node --test tests/test_preview_v02.cjs
    - name: Verify ARM64 Qt WebEngine packages exist
      if: matrix.machine == 'ARM64'
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        python -m pip install --upgrade aqtinstall
        if ($LASTEXITCODE -ne 0) { throw "aqtinstall setup failed" }
        Write-Host "Qt target: ${{ matrix.qt_version }} / ${{ matrix.qt_arch }}"
        python -m aqt list-qt windows desktop --arch "${{ matrix.qt_version }}"
        if ($LASTEXITCODE -ne 0) { throw "Could not list Qt architectures" }
        $available = python -m aqt list-qt windows desktop --modules "${{ matrix.qt_version }}" "${{ matrix.qt_arch }}" 2>&1
        $available | ForEach-Object { Write-Host $_ }
        if ($LASTEXITCODE -ne 0) { throw "Could not list Qt ARM64 modules" }
        $moduleNames = ($available -join ' ') -split '\s+'
        foreach ($needed in @('qtwebengine','qtwebchannel','qtpositioning')) {
          if ($needed -notin $moduleNames) { throw "Qt ${{ matrix.qt_version }} ARM64 package '$needed' is unavailable; cannot build native WebEngine app" }
        }
    - name: Install Qt 6 (ARM64 with x64 host tools)
      if: matrix.machine == 'ARM64'
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $qtRoot = Join-Path $env:GITHUB_WORKSPACE 'qt-arm64'
        python -m aqt install-qt windows desktop "${{ matrix.qt_version }}" "${{ matrix.qt_arch }}" --autodesktop --outputdir "$qtRoot" --modules qtwebengine qtwebchannel qtpositioning
        if ($LASTEXITCODE -ne 0) { throw "Qt ARM64 installation failed with exit code $LASTEXITCODE" }
        $qtDir = Join-Path (Join-Path $qtRoot "${{ matrix.qt_version }}") 'msvc2022_arm64'
        $qtHost = Join-Path (Join-Path $qtRoot "${{ matrix.qt_version }}") 'msvc2022_64'
        if (-not (Test-Path (Join-Path $qtDir 'lib/cmake/Qt6WebEngineCore/Qt6WebEngineCoreConfig.cmake'))) {
          throw "ARM64 Qt WebEngineCore CMake package missing in $qtDir"
        }
        if (-not (Test-Path (Join-Path $qtHost 'lib/cmake/Qt6/Qt6Config.cmake'))) {
          throw "x64 host Qt installation missing in $qtHost"
        }
        "QT_ROOT_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "QT_HOST_PATH=$qtHost" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "Qt ARM64 target: $qtDir"
        Write-Host "Qt x64 host tools: $qtHost"
    - name: Install Qt 6 (x64)
      if: matrix.machine == 'X64'
      uses: jurplel/install-qt-action@v4
      with:
        version: "${{ matrix.qt_version }}"
        arch: "${{ matrix.qt_arch }}"
        modules: "qtwebengine qtwebchannel qtpositioning"
    - name: Install Inno Setup
      run: |
        choco install innosetup -y
      shell: powershell
    - name: Install dependencies
      run: |
        mkdir build
        curl -L https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-${{ matrix.mpv_arch }}-${{ env.MPV_VERSION }}.7z/download > mpv.7z
        7z x mpv.7z
        mkdir mpv
        mv include mpv
        gendef libmpv-2.dll
        mv libmpv-2.dll mpv/libmpv-2.dll
        mv libmpv-2.def mpv.def
        mv mpv.def libmpv.dll.a mpv/
        mv mpv build/
        if [ -n "${{ matrix.mpv_arch_fallback }}" ]; then
          curl -L https://sourceforge.net/projects/mpv-player-windows/files/libmpv/mpv-dev-${{ matrix.mpv_arch_fallback }}-${{ env.MPV_VERSION }}.7z/download > mpv-fallback.7z
          7z x mpv-fallback.7z -ompv-fallback-tmp
          mkdir build/mpv-fallback
          mv mpv-fallback-tmp/libmpv-2.dll build/mpv-fallback/
        fi
      shell: bash
    - name: Bundle VC runtime DLLs
      run: |
        mkdir deps
        mkdir deps/vcruntime
        # Dynamically locate VS installation on runner
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
        if (-not $vsPath) {
            $vsPath = (Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*" | Where-Object { Test-Path "$_\VC\Redist\MSVC" } | Select-Object -First 1).FullName
        }
        $vsRedist = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\${{ matrix.vc_redist_arch }}\Microsoft.VC*.CRT" | Select-Object -First 1
        if (-not $vsRedist) {
            $vsRedist = Get-ChildItem "$vsPath\VC\Redist\MSVC" -Recurse -Filter "Microsoft.VC*.CRT" | Where-Object { $_.FullName -like "*${{ matrix.vc_redist_arch }}*" } | Select-Object -First 1
        }
        Copy-Item "$vsRedist\*.dll" deps/vcruntime/
        # Also grab VCRedist installer for optional system-wide install
        Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile deps/vc_redist.x64.exe
      shell: powershell
    - name: Build
      run: |
        set "VS_PATH="
        for /f "tokens=*" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath 2^>nul') do set "VS_PATH=%%i"
        if not defined VS_PATH (
            for /d %%d in ("C:\Program Files\Microsoft Visual Studio\*") do (
                for /d %%e in ("%%d\*") do (
                    if exist "%%e\VC\Auxiliary\Build\${{ matrix.vcvars }}" set "VS_PATH=%%e"
                )
            )
        )
        call "%VS_PATH%\VC\Auxiliary\Build\${{ matrix.vcvars }}"
        cd build
        set PATH=%PATH%;C:\Program Files (x86)\Inno Setup 6;%CD%
        set "QT_ROOT_DIR=%QT_ROOT_DIR:\=/%"
        cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=output -DQTROOT=%QT_ROOT_DIR% -DQT_HOST_PATH=%QT_HOST_PATH% -DMPV_INCLUDE_DIR=mpv/include -DMPV_LIBRARY=mpv/libmpv-2.dll -DCHECK_FOR_UPDATES=ON -DUSE_STATIC_MPVQT=ON ..
        lib /def:mpv\mpv.def /out:mpv\libmpv-2.dll.lib /MACHINE:${{ matrix.machine }}
        ninja
        ninja windows_all
      shell: cmd
    - name: Verify extracted Portable and smoke-test startup (x64)
      if: matrix.machine == 'X64'
      shell: powershell
      run: |
        $zip = Get-ChildItem build/JellyfinDesktop-*.zip | Select-Object -First 1
        if (-not $zip) { throw 'Portable ZIP was not generated' }
        ./scripts/VerifyPortable.ps1 -ZipPath $zip.FullName
    - name: Verify portable PE architecture and WebEngine files (ARM64)
      if: matrix.machine == 'ARM64'
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $zip = Get-ChildItem build/JellyfinDesktop-*.zip | Select-Object -First 1
        if (-not $zip) { throw 'ARM64 portable ZIP was not generated' }
        $stage = Join-Path $env:RUNNER_TEMP 'jfd-arm64-portable-check'
        Expand-Archive -LiteralPath $zip.FullName -DestinationPath $stage -Force
        foreach ($f in @('Jellyfin Desktop.exe','Qt6Core.dll','Qt6WebEngineCore.dll','libmpv-2.dll','QtWebEngineProcess.exe')) {
          $file = Join-Path $stage $f
          if (-not (Test-Path $file)) { throw "Missing ARM64 portable dependency: $f" }
          $reader = [System.IO.BinaryReader]::new([System.IO.File]::OpenRead($file))
          try {
            $reader.BaseStream.Seek(0x3c, [System.IO.SeekOrigin]::Begin) | Out-Null
            $peOffset = $reader.ReadInt32()
            $reader.BaseStream.Seek($peOffset + 4, [System.IO.SeekOrigin]::Begin) | Out-Null
            $machine = $reader.ReadUInt16()
          } finally { $reader.Dispose() }
          if ($machine -ne 0xAA64) { throw "$f is not ARM64 (PE machine 0x$($machine.ToString('X4')))" }
        }
        if (-not (Test-Path (Join-Path $stage 'qml/QtWebEngine'))) { throw 'QtWebEngine QML resources missing' }
        $report = Join-Path $PWD 'build/portable-validation'
        New-Item -ItemType Directory -Force $report | Out-Null
        'PASS: required binaries are native ARM64; x64 runner cannot perform ARM64 startup test.' | Set-Content (Join-Path $report 'result.txt')
    - name: Archive Portable validation
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}-surface-searchhub-v37-preview-v02-validation
        path: build/portable-validation/
        if-no-files-found: ignore
    - name: Archive installer
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}-surface-searchhub-v37-installer
        path: ${{ github.workspace }}/build/JellyfinDesktop-*.exe
    - name: Archive portable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}-surface-searchhub-v37-preview-v02-portable
        path: ${{ github.workspace }}/build/JellyfinDesktop-*.zip
        if-no-files-found: error
