name: build-surface-c02-desktop-x64

on:
  push:
    branches:
      - surface-offline-c02-desktop-x64-preview
      - surface-offline-c02-inapp-mpv-x64
      - surface-offline-c02-home-redesign-x64
      - surface-offline-c02-native-sidebar-x64
    paths:
      - 'surface-arm64/**'
      - '.github/workflows/build-surface-c02-desktop-x64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and existing touch tests
        run: |
          $ErrorActionPreference = 'Stop'
          node --check surface-arm64/controls.js
          node --check surface-arm64/trickplay-preview.js
          node --check surface-arm64/searchhub.js
          node --check surface-arm64/offline-controls.js
          node --check surface-arm64/online-jacket-capture.js
          node --check surface-arm64/offline-home.js
          node --test surface-arm64/tests/gestures.test.cjs
          node --test surface-arm64/tests/touch-runtime.test.cjs
          node --test surface-arm64/tests/preview-runtime.test.cjs
          node --test surface-arm64/tests/searchhub-position.test.cjs
          node --test surface-arm64/tests/searchhub-navigation.test.cjs
          node --test surface-arm64/tests/offline-home-smoke.test.cjs
          node --test surface-arm64/tests/native-sidebar-smoke.test.cjs
          node --test surface-arm64/tests/native-library-runtime.test.cjs
          node --test surface-arm64/tests/immersive-hud-smoke.test.cjs
      - name: Publish C02 Windows desktop x64
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish surface-arm64/JellyfinSurface.csproj -c Release -r win-x64 --self-contained true -p:RuntimeIdentifier=win-x64 -p:PlatformTarget=x64 -p:AssemblyName=JellyfinSurfaceX64 -o publish-x64
      - name: Bundle verified LGPL libmpv native decoder
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://github.com/mpv-player/mpv/releases/download/v0.42.0/libmpv-v0.42.0-x86_64-w64-mingw32-lgpl.zip'
          Invoke-WebRequest -Uri $uri -OutFile libmpv-lgpl-x64.zip
          $hash = (Get-FileHash libmpv-lgpl-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '8e5f77430efc53ef175804ba6618527e3af0448a0dcabf04d3cc72659d1a6fce') {
            throw "libmpv SHA256 mismatch: $hash"
          }
          Expand-Archive -Path libmpv-lgpl-x64.zip -DestinationPath libmpv-unpack
          $native = Get-ChildItem -Path libmpv-unpack -Recurse -Filter libmpv-2.dll -File | Select-Object -First 1
          if ($null -eq $native) { throw 'libmpv-2.dll missing from verified official archive' }
          Get-ChildItem -Path $native.DirectoryName -Filter '*.dll' -File | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination publish-x64 -Force
          }
          $licenseDir = 'publish-x64/third-party-licenses/mpv'
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          Get-ChildItem libmpv-unpack -File -Recurse | Where-Object {
            $_.Name -match '^(COPYING|LICENSE|README|copyright)(\.|$)'
          } | ForEach-Object {
            Copy-Item $_.FullName -Destination $licenseDir -Force
          }
          if (!(Test-Path publish-x64/libmpv-2.dll)) { throw 'native decoder missing in artifact' }
      - name: Verify x64 application and offline assets
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path (Resolve-Path publish-x64).Path 'JellyfinSurfaceX64.exe'
          if (!(Test-Path $exe)) { throw 'x64 executable missing' }
          if (!(Test-Path publish-x64/runtimes/win-x64/native/WebView2Loader.dll)) { throw 'x64 WebView2 native loader missing' }
          if (!(Test-Path publish-x64/libmpv-2.dll)) { throw 'embedded native AVI playback DLL missing' }
          foreach ($file in @('controls.js','searchhub.js','offline-controls.js','offline-home.html','offline-home.js','offline-player.html','online-jacket-capture.js')) {
            if (!(Test-Path "publish-x64/$file")) { throw "Required asset missing: $file" }
          }
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test-x64' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Native desktop x64 self-test failed: $($process.ExitCode)" }
          $decoder = Start-Process -FilePath $exe -ArgumentList '--self-test-native-mpv' -Wait -PassThru
          if ($decoder.ExitCode -ne 0) { throw "Native mpv DLL load test failed: $($decoder.ExitCode)" }
          $gestures = Start-Process -FilePath $exe -ArgumentList '--self-test-native-gestures' -Wait -PassThru
          if ($gestures.ExitCode -ne 0) { throw "Native offline swipe gesture test failed: $($gestures.ExitCode)" }
          $sidebar = Start-Process -FilePath $exe -ArgumentList '--self-test-native-sidebar' -Wait -PassThru
          if ($sidebar.ExitCode -ne 0) { throw "Native library sidebar route test failed: $($sidebar.ExitCode)" }
          $source = Get-Content -Raw surface-arm64/OfflineLibrary.cs
          if ($source -notmatch 'NativeMpvPlayer.TryShow' -or $source -match 'GetExtension\(path\)\.Equals\("\.avi"') {
            throw 'Playback must use the same native UI for every supported extension'
          }
          'PASS: native x64 runtime and offline assets. Full UI and Jellyfin require desktop testing.' | Set-Content publish-x64/validation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-surface-c02-native-sidebar-desktop-x64
          path: publish-x64/**
          if-no-files-found: error
          retention-days: 14
