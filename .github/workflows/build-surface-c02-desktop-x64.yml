name: build-surface-c02-desktop-x64

on:
  push:
    branches:
      - surface-offline-c02-desktop-x64-preview
    paths:
      - 'surface-arm64/**'
      - '.github/workflows/build-surface-c02-desktop-x64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and existing touch tests
        run: |
          $ErrorActionPreference = 'Stop'
          node --check surface-arm64/controls.js
          node --check surface-arm64/trickplay-preview.js
          node --check surface-arm64/searchhub.js
          node --check surface-arm64/offline-controls.js
          node --check surface-arm64/online-jacket-capture.js
          node --check surface-arm64/offline-home.js
          node --test surface-arm64/tests/gestures.test.cjs
          node --test surface-arm64/tests/touch-runtime.test.cjs
          node --test surface-arm64/tests/preview-runtime.test.cjs
          node --test surface-arm64/tests/searchhub-position.test.cjs
          node --test surface-arm64/tests/searchhub-navigation.test.cjs
          node --test surface-arm64/tests/offline-home-smoke.test.cjs
      - name: Publish C02 Windows desktop x64
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish surface-arm64/JellyfinSurface.csproj -c Release -r win-x64 --self-contained true -p:RuntimeIdentifier=win-x64 -p:PlatformTarget=x64 -p:AssemblyName=JellyfinSurfaceX64 -o publish-x64
      - name: Verify x64 application and offline assets
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path (Resolve-Path publish-x64).Path 'JellyfinSurfaceX64.exe'
          if (!(Test-Path $exe)) { throw 'x64 executable missing' }
          if (!(Test-Path publish-x64/runtimes/win-x64/native/WebView2Loader.dll)) { throw 'x64 WebView2 native loader missing' }
          foreach ($file in @('controls.js','searchhub.js','offline-controls.js','offline-home.html','offline-home.js','offline-player.html','online-jacket-capture.js')) {
            if (!(Test-Path "publish-x64/$file")) { throw "Required asset missing: $file" }
          }
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test-x64' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Native desktop x64 self-test failed: $($process.ExitCode)" }
          'PASS: native x64 runtime and offline assets. Full UI and Jellyfin require desktop testing.' | Set-Content publish-x64/validation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-surface-v26-offline-c02-desktop-x64
          path: publish-x64/**
          if-no-files-found: error
          retention-days: 14
